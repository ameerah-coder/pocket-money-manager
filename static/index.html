<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket-Money Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    #firstHeading{ color: #b00020;}
    input, select, button { padding: 0.5rem; margin: 0.25rem 0; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .hidden { display: none; }
    #message { color: #b00020; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #eee; }
    .income { color: #1b7f3b; }
    .expense { color: #b00020; }
    .warning { background: #fdecea; color: #b00020; padding: 0.6rem; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <h1 id="firstHeading">Pocket-Money Manager</h1>
  <p id="message"></p>

  <div id="loginBox" class="box">
    <h2>Log in or register</h2>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Log in</button>
    <button onclick="register()">Register</button>
  </div>

  <div id="appBox" class="hidden">
    <p><button onclick="logout()">Log out</button></p>

    <div class="box">
      <h2>Monthly summary</h2>
      <label>Month:
        <input id="month" placeholder="YYYY-MM" size="8" onchange="loadSummary()">
      </label>
      <button onclick="loadSummary()">Show</button><br>
      <input id="budgetInput" type="number" min="0" step="0.01" placeholder="Budget amount">
      <button onclick="setBudget()">Set budget</button>

      <p id="warning" class="warning hidden"></p>
      <p>Income: <b id="totalIncome">0</b></p>
      <p>Spent: <b id="totalSpent">0</b></p>
      <p>Budget: <b id="budgetValue">not set</b></p>
      <p>Remaining: <b id="remaining">-</b></p>

      <h3>Spending by category</h3>
      <ul id="categoryList"></ul>
      <p id="noCategories">No spending this month.</p>
    </div>

    <div class="box">
      <h2>Add a transaction</h2>
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <input id="amount" type="number" min="0" step="0.01" placeholder="Amount"><br>
      <input id="category" placeholder="Category (e.g. food)">
      <input id="note" placeholder="Note"><br>
      <input id="date" type="date">
      <button onclick="addTransaction()">Add</button>
    </div>

    <div class="box">
      <h2>My transactions</h2>
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr>
        </thead>
        <tbody id="transactionRows"></tbody>
      </table>
      <p id="emptyText">No transactions yet.</p>
    </div>
  </div>

  <script>
    let token = null;

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function errorText(data) {
      if (typeof data.detail === "string") return data.detail;
      return "Please check the fields: username 3+ characters, password 6+, amount above zero, month like 2026-11.";
    }

    async function api(path, method, body) {
      const options = { method: method || "GET", headers: {} };
      if (token) options.headers["Authorization"] = "Bearer " + token;
      if (body) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch(path, options);
      const data = await response.json();
      return { ok: response.ok, status: response.status, data: data };
    }

    function credentials() {
      return {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      };
    }

    async function register() {
      const result = await api("/register", "POST", credentials());
      showMessage(result.ok ? "Account created. Now log in." : errorText(result.data));
    }

    async function login() {
      const result = await api("/login", "POST", credentials());
      if (!result.ok) {
        showMessage(errorText(result.data));
        return;
      }
      token = result.data.token;
      showMessage("");
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("date").value = today;
      document.getElementById("month").value = today.slice(0, 7);
      loadTransactions();
      loadSummary();
    }

    function logout() {
      token = null;
      document.getElementById("appBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
      document.getElementById("transactionRows").innerHTML = "";
    }

    function addCell(row, text, className) {
      const cell = document.createElement("td");
      cell.textContent = text;
      if (className) cell.className = className;
      row.appendChild(cell);
    }

    async function loadTransactions() {
      const result = await api("/transactions");
      if (!result.ok) {
        showMessage(errorText(result.data));
        return;
      }
      const body = document.getElementById("transactionRows");
      body.innerHTML = "";
      document.getElementById("emptyText").classList.toggle("hidden", result.data.length > 0);

      for (const t of result.data) {
        const row = document.createElement("tr");
        addCell(row, t.date);
        addCell(row, t.type, t.type);
        addCell(row, t.category || "");
        addCell(row, t.note || "");
        addCell(row, t.amount);

        const actionCell = document.createElement("td");
        const button = document.createElement("button");
        button.textContent = "Delete";
        button.onclick = function () { deleteTransaction(t.id); };
        actionCell.appendChild(button);
        row.appendChild(actionCell);

        body.appendChild(row);
      }
    }

    async function addTransaction() {
      const result = await api("/transactions", "POST", {
        type: document.getElementById("type").value,
        amount: Number(document.getElementById("amount").value),
        category: document.getElementById("category").value || null,
        note: document.getElementById("note").value || null,
        date: document.getElementById("date").value
      });
      if (!result.ok) {
        showMessage(errorText(result.data));
        return;
      }
      showMessage("");
      document.getElementById("amount").value = "";
      document.getElementById("category").value = "";
      document.getElementById("note").value = "";
      loadTransactions();
      loadSummary();
    }

    async function deleteTransaction(id) {
      const result = await api("/transactions/" + id, "DELETE");
      if (!result.ok) {
        showMessage(errorText(result.data));
        return;
      }
      loadTransactions();
      loadSummary();
    }

    async function loadSummary() {
      const month = document.getElementById("month").value;
      if (!/^\d{4}-\d{2}$/.test(month)) {
        showMessage("Enter the month like 2026-11.");
        return;
      }
      showMessage("");
      const result = await api("/summary/" + month);
      if (!result.ok) {
        showMessage(errorText(result.data));
        return;
      }
      const s = result.data;
      document.getElementById("totalIncome").textContent = s.total_income;
      document.getElementById("totalSpent").textContent = s.total_spent;
      document.getElementById("budgetValue").textContent = s.budget === null ? "not set" : s.budget;
      document.getElementById("remaining").textContent = s.budget === null ? "-" : s.budget - s.total_spent;

      const warning = document.getElementById("warning");
      warning.textContent = s.warning || "";
      warning.classList.toggle("hidden", !s.warning);

      const list = document.getElementById("categoryList");
      list.innerHTML = "";
      const entries = Object.entries(s.spent_by_category);
      document.getElementById("noCategories").classList.toggle("hidden", entries.length > 0);
      for (const [name, total] of entries) {
        const item = document.createElement("li");
        item.textContent = name + ": " + total;
        list.appendChild(item);
      }
    }

    async function setBudget() {
      const month = document.getElementById("month").value;
      const amount = Number(document.getElementById("budgetInput").value);
      const result = await api("/budgets", "PUT", { month: month, amount: amount });
      if (!result.ok) {
        showMessage(errorText(result.data));
        return;
      }
      showMessage("");
      loadSummary();
    }
  </script>
</body>
</html>
